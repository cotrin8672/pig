[package]
name = "pig-pairing-probe"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
pig-pairing = { path = "../../apps/desktop/src-tauri/pairing" }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-relay = { version = "=1.5.0", default-features = false, features = ["server", "tls-ring"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(windows)'.dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0
