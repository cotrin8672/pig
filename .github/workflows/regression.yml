name: Regression

on:
  schedule:
    - cron: '0 18 * * *' # 03:00 JST, on dev before its nightly
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, ui]
    steps:
      - uses: actions/checkout@v4
        with:
          # Schedules start on the default branch; nightly code lives on dev.
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      - name: Run ${{ matrix.suite }} regressions
        run: pnpm test:${{ matrix.suite }}
        env:
          PI_OFFLINE: '1'
      - name: Verify remote pairing across restart and run isolated loopback chat
        if: matrix.suite == 'integration'
        shell: pwsh
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
        run: |
          cargo test --locked --manifest-path examples/remote-pairing-poc/Cargo.toml
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path apps/desktop/src-tauri/Cargo.toml -p pig-remote
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          bun apps/desktop/scripts/remote-smoke.ts
