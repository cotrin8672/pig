name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: >-
    checks-${{ github.workflow }}-${{
    github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      # Cache the shared SDK/toolchains, never the generated project devkit.
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: >-
            hutch-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('pnpm-lock.yaml') }}
          restore-keys: hutch-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build webview (native packaging belongs to Release)
        run: pnpm --filter @pig/desktop exec vite build
