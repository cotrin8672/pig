name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      # Cache Hutch's SDK/toolchains; regenerate the project devkit.
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: >-
          bun test apps/desktop/scripts/sdk-runtime-assets.test.ts
          apps/desktop/scripts/post-build.test.ts
      - run: pnpm build
