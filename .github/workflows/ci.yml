name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: pnpm install --frozen-lockfile
      # electrobun downloads its CLI/core binaries from GitHub Releases on first build; cache them.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.pnpm/electrobun@*/node_modules/electrobun/bin/electrobun.exe
            node_modules/.pnpm/electrobun@*/node_modules/electrobun/.cache
            node_modules/.pnpm/electrobun@*/node_modules/electrobun/dist-win-x64
          key: electrobun-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml', 'patches/electrobun@*.patch') }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
