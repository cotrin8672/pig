# Shell snippets and GitHub expressions are intentionally kept on long lines.
# yamllint disable rule:line-length
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *' # 04:00 JST; no native build on every main push.

permissions:
  contents: read

# Serialize publication, including the stable bucket commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
    steps:
      - name: Skip unchanged scheduled nightlies
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != refs/heads/main ]]; then
            echo 'Manual nightlies must run on main'; exit 1
          fi
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            published=$(gh release view nightly --json body,assets --jq 'select(any(.assets[]; .name == "pig-windows-x64.zip") and any(.assets[]; .name == "pig-windows-x64.zip.sha256")) | .body' 2>/dev/null || true)
            if [[ "$published" == *"from commit $GITHUB_SHA."* ]]; then publish=false; fi
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  release:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check and build the same event revision, even if main advances.
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Set up pinned TypeScript Native Preview
        uses: jdx/mise-action@v3
      - name: Identify release
        id: release
        run: |
          set -euo pipefail
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vX.Y.Z tag'; exit 1; }
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag must match apps/desktop/package.json'; exit 1; }
            bun -e 'import config from "./apps/desktop/electrobun.config.ts"; if (config.app.version !== process.env.GITHUB_REF_NAME.slice(1)) throw new Error("Tag must match electrobun.config.ts");'
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo 'tag=nightly' >> "$GITHUB_OUTPUT"
            echo "version=$version-nightly.$(date -u +%Y%m%d).${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      # Hutch owns the pinned SDK and runtime toolchains; the project devkit is regenerated.
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: hutch-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build portable app (shared stable profile)
        env:
          PIG_RELEASE_CHANNEL: ${{ steps.release.outputs.tag == 'nightly' && 'nightly' || 'stable' }}
          PIG_RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PIG_RELEASE_COMMIT: ${{ steps.release.outputs.sha }}
        timeout-minutes: 20
        run: |
          set -euo pipefail
          pnpm --filter @pig/desktop exec vite build
          pnpm --filter @pig/desktop exec electrobun build --env=stable
      - name: Package ZIP and checksum
        shell: pwsh
        run: ./.github/scripts/package.ps1 -OutputDirectory $env:RELEASE_DIR
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ github.sha }}
          path: |
            ${{ env.RELEASE_DIR }}/pig-windows-x64.zip
            ${{ env.RELEASE_DIR }}/pig-windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == nightly ]]; then
            notes="Nightly $VERSION from commit $SHA. Built with the stable identifier and channel to share settings and projects. Unsigned Windows x64 portable build; requires WebView2."
            if ! gh release view nightly >/dev/null 2>&1; then
              gh release create nightly --target "$SHA" --prerelease --latest=false --title 'pig nightly' --notes 'Nightly publication in progress.'
            fi
            gh release upload nightly "$RELEASE_DIR/pig-windows-x64.zip" "$RELEASE_DIR/pig-windows-x64.zip.sha256" --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true
            # The skip marker is written last so interrupted uploads are retried.
            gh release edit nightly --prerelease --latest=false --title 'pig nightly' --notes "$notes"
          else
            gh release create "$TAG" --verify-tag --latest --title "pig $VERSION" \
              --notes "Unsigned Windows x64 portable build; requires WebView2. Install with Scoop using the repository bucket." \
              "$RELEASE_DIR/pig-windows-x64.zip" "$RELEASE_DIR/pig-windows-x64.zip.sha256"
          fi
      # checkver/autoupdate are metadata, not a scheduler. Commit the actual
      # published hash so ordinary 'scoop update' works without Excavator.
      - name: Update stable Scoop manifest on main
        if: steps.release.outputs.tag != 'nightly'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C bucket-update origin/main
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'bucket/pig.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = process.env.VERSION;
          manifest.architecture['64bit'].url = `https://github.com/cotrin8672/pig/releases/download/v${process.env.VERSION}/pig-windows-x64.zip`;
          manifest.architecture['64bit'].hash = fs.readFileSync(`${process.env.RELEASE_DIR}/pig-windows-x64.zip.sha256`, 'utf8').trim().split(/\s+/)[0];
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          pnpm exec biome format --write bucket/pig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/pig.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(scoop): update pig to $VERSION"
            git push origin HEAD:main
          fi
