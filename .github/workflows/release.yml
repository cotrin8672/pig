# Shell snippets and GitHub expressions are intentionally kept on long lines.
# yamllint disable rule:line-length
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_only:
        description: Build and upload a test artifact without publishing Nightly
        type: boolean
        default: true
  schedule:
    - cron: '0 19 * * *' # 04:00 JST nightly from dev; no native build on every push.

permissions:
  contents: read

# Serialize publication, including the stable bucket commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.changes.outputs.publish }}
      sha: ${{ steps.changes.outputs.sha }}
    steps:
      - name: Resolve revision and skip unchanged scheduled nightlies
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Stable releases are tags on main; nightlies are built from dev.
          case "$GITHUB_EVENT_NAME" in
            push)
              sha=$GITHUB_SHA
              status=$(gh api "repos/$GH_REPO/compare/main...$sha" --jq .status)
              [[ "$status" == identical || "$status" == behind ]] || { echo "Stable tags must point to a commit on main ($status)"; exit 1; } ;;
            workflow_dispatch)
              [[ "$GITHUB_REF" == refs/heads/dev ]] || { echo 'Manual nightlies must run on dev'; exit 1; }
              sha=$GITHUB_SHA ;;
            schedule)
              # Schedules always start on the default branch; pin dev's tip once.
              sha=$(gh api "repos/$GH_REPO/commits/dev" --jq .sha) ;;
            *) echo "Unsupported event $GITHUB_EVENT_NAME"; exit 1 ;;
          esac
          publish=true
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            published=$(gh release view nightly --json body,assets --jq 'select(any(.assets[]; .name == "pig-setup.exe") and any(.assets[]; .name == "pig-windows-x64.zip.sha256")) | .body' 2>/dev/null || true)
            if [[ "$published" == *"from commit $sha."* ]]; then publish=false; fi
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
  release:
    needs: changes
    if: needs.changes.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Check and build the resolved revision, even if its branch advances.
          ref: ${{ needs.changes.outputs.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Set up pinned TypeScript Native Preview
        uses: jdx/mise-action@v3
        with:
          install_args: npm:@typescript/native-preview
      - name: Identify release
        id: release
        run: |
          set -euo pipefail
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          sha=$(git rev-parse HEAD)
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vX.Y.Z tag'; exit 1; }
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag must match apps/desktop/package.json'; exit 1; }
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo 'tag=nightly' >> "$GITHUB_OUTPUT"
            echo "version=$version-nightly.$(date -u +%Y%m%d).${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile
      # Hutch owns the pinned SDK and runtime toolchains; the project devkit is regenerated.
      - uses: actions/cache@v4
        with:
          path: ~/.hutch
          key: hutch-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: hutch-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm lint
      - run: pnpm typecheck:tsgo
      - run: pnpm test
      - name: Build Tauri portable app
        env:
          PIG_RELEASE_VERSION: ${{ steps.release.outputs.version }}
        timeout-minutes: 20
        run: |
          rustup target add x86_64-pc-windows-msvc
          rustup show active-toolchain
          pnpm --filter @pig/desktop tauri:package
      - name: Package ZIP and checksum
        shell: pwsh
        run: ./.github/scripts/package.ps1 -OutputDirectory $env:RELEASE_DIR
      - name: Build signed Tauri installer
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_LABEL: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          : "${UPDATER_PUBLIC_KEY:?Missing updater public key}" "${TAURI_SIGNING_PRIVATE_KEY:?Missing updater signing key}"
          # One monotonically increasing Windows-compatible version across both channels.
          export PIG_INSTALLER_VERSION="1.$((GITHUB_RUN_NUMBER / 65535)).$((GITHUB_RUN_NUMBER % 65535))"
          jq -n --arg v "$PIG_INSTALLER_VERSION" --arg key "$UPDATER_PUBLIC_KEY" '{
            version:$v, bundle:{active:true, targets:["nsis"], createUpdaterArtifacts:true,
            resources:{"../build/tauri-portable/host/":"host/","../build/tauri-portable/pig-remote.exe":"pig-remote.exe"}},
            plugins:{updater:{pubkey:$key,windows:{installMode:"passive"}}}
          }' > src-tauri/installer.json
          pnpm dlx @tauri-apps/cli@2.12.6 build --config src-tauri/installer.json --bundles nsis
          files=(src-tauri/target/release/bundle/nsis/*-setup.exe)
          [[ ${#files[@]} == 1 && -s "${files[0]}.sig" ]]
          cp "${files[0]}" "$RELEASE_DIR/pig-setup.exe"
          jq -n --arg v "$PIG_INSTALLER_VERSION" --arg label "$RELEASE_LABEL" \
            --arg sig "$(cat "${files[0]}.sig")" --arg url "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/pig-setup.exe" \
            '{version:$v,notes:$label,platforms:{"windows-x86_64":{signature:$sig,url:$url}}}' > "$RELEASE_DIR/update.json"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ needs.changes.outputs.sha }}
          path: |
            ${{ env.RELEASE_DIR }}/pig-windows-x64.zip
            ${{ env.RELEASE_DIR }}/pig-windows-x64.zip.sha256
            ${{ env.RELEASE_DIR }}/pig-setup.exe
            ${{ env.RELEASE_DIR }}/update.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Publish release
        if: github.event_name != 'workflow_dispatch' || !inputs.build_only
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == nightly ]]; then
            notes="Nightly $VERSION from commit $SHA. Built with Tauri. Requires WebView2. Use pig-setup.exe for in-app updates. Desktop settings and chat history are shared with Electrobun by default."
            if ! gh release view nightly >/dev/null 2>&1; then
              gh release create nightly --target "$SHA" --prerelease --latest=false --title 'pig nightly' --notes 'Nightly publication in progress.'
            fi
            gh release upload nightly "$RELEASE_DIR/pig-windows-x64.zip" "$RELEASE_DIR/pig-windows-x64.zip.sha256" "$RELEASE_DIR/pig-setup.exe" --clobber
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true
            # The skip marker is written last so interrupted uploads are retried.
          else
            gh release create "$TAG" --verify-tag --latest --title "pig $VERSION" \
              --notes "Tauri for Windows x64; requires WebView2. Use pig-setup.exe for in-app updates, or install the portable build via Scoop." \
              "$RELEASE_DIR/pig-windows-x64.zip" "$RELEASE_DIR/pig-windows-x64.zip.sha256" "$RELEASE_DIR/pig-setup.exe"
          fi
          if ! gh release view tauri-updates >/dev/null 2>&1; then
            gh release create tauri-updates --target "$SHA" --prerelease --latest=false --title 'Tauri update feeds' --notes 'Manifests for the installer edition.'
          fi
          cd "$RELEASE_DIR"
          cp update.json inclusive.json
          feeds=(inclusive.json)
          if [[ "$TAG" != nightly ]]; then
            cp update.json stable.json; feeds+=(stable.json)
          elif [[ $(gh release view tauri-updates --json assets --jq '[.assets[] | select(.name=="stable.json")] | length') == 0 ]]; then
            # No Tauri stable yet: valid manifest older than every installer.
            jq '.version="0.0.0"' update.json > stable.json; feeds+=(stable.json)
          fi
          gh release upload tauri-updates "${feeds[@]}" --clobber
          if [[ "$TAG" == nightly ]]; then gh release edit nightly --prerelease --latest=false --title 'pig nightly' --notes "$notes"; fi
      # checkver/autoupdate are metadata, not a scheduler. Commit the actual
      # published hash so ordinary 'scoop update' works without Excavator.
      - name: Update stable Scoop manifest on main
        if: steps.release.outputs.tag != 'nightly'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C bucket-update origin/main
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'bucket/pig.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = process.env.VERSION;
          manifest.architecture['64bit'].url = `https://github.com/cotrin8672/pig/releases/download/v${process.env.VERSION}/pig-windows-x64.zip`;
          manifest.architecture['64bit'].hash = fs.readFileSync(`${process.env.RELEASE_DIR}/pig-windows-x64.zip.sha256`, 'utf8').trim().split(/\s+/)[0];
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          pnpm exec biome format --write bucket/pig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/pig.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(scoop): update pig to $VERSION"
            git push origin HEAD:main
          fi
