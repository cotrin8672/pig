name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Serialize publication, including the stable bucket commit.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Manual runs and queued main builds always build the latest main.
          ref: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref || 'main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # Upstream v0.42.0 README documents this native Windows release ZIP.
      - name: Install RTK 0.42.0 (verified release archive)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'rtk-0.42.0.zip'
          Invoke-WebRequest 'https://github.com/rtk-ai/rtk/releases/download/v0.42.0/rtk-x86_64-pc-windows-msvc.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne '527552ec419988ff4a862415ba28d5aa7c1148ef3dc926ae11a4c133e63a7491') { throw 'RTK archive checksum mismatch' }
          $directory = Join-Path $env:RUNNER_TEMP 'rtk-0.42.0'
          Expand-Archive -Path $archive -DestinationPath $directory
          $version = & "$directory/rtk.exe" --version
          if ($LASTEXITCODE -ne 0 -or $version -ne 'rtk 0.42.0') { throw 'Unexpected RTK executable' }
          $directory >> $env:GITHUB_PATH
      - name: Identify release
        id: release
        run: |
          set -euo pipefail
          echo "RELEASE_DIR=$RUNNER_TEMP/release" >> "$GITHUB_ENV"
          sha=$(rtk proxy git rev-parse HEAD)
          version=$(rtk proxy node -p "require('./apps/desktop/package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/tags/v* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a stable vX.Y.Z tag'; exit 1; }
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo 'Tag must match apps/desktop/package.json'; exit 1; }
            rtk proxy bun --no-install -e 'import config from "./apps/desktop/electrobun.config.ts"; if (config.app.version !== process.env.GITHUB_REF_NAME.slice(1)) throw new Error("Tag must match electrobun.config.ts");'
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          else
            echo 'tag=nightly' >> "$GITHUB_OUTPUT"
            echo "version=$version-nightly.$(date -u +%Y%m%d).${sha:0:7}" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - run: rtk proxy pnpm install --frozen-lockfile
      # electrobun downloads its CLI/core binaries from GitHub Releases on first build; cache them.
      - uses: actions/cache@v4
        with:
          path: |
            node_modules/.pnpm/electrobun@*/node_modules/electrobun/bin/electrobun.exe
            node_modules/.pnpm/electrobun@*/node_modules/electrobun/.cache
            node_modules/.pnpm/electrobun@*/node_modules/electrobun/dist-win-x64
          key: electrobun-${{ runner.os }}-${{ hashFiles('pnpm-workspace.yaml', 'patches/electrobun@*.patch') }}
      - run: rtk proxy pnpm typecheck
      - run: rtk proxy pnpm lint
      # Root test covers desktop src + scripts (staging/P0) + packages/config/src.
      - run: rtk proxy pnpm test
      - name: Native Durable smoke (tooling Bun)
        run: rtk proxy bun --no-install apps/desktop/scripts/smoke.ts
      - name: Build portable app (shared stable profile)
        run: |
          set -euo pipefail
          rtk proxy pnpm --filter @pig/desktop exec vite build
          rtk proxy pnpm --filter @pig/desktop exec electrobun build --env=stable
      - name: Package ZIP and checksum
        shell: pwsh
        run: ./.github/scripts/package.ps1 -OutputDirectory $env:RELEASE_DIR
      - name: Native Durable smoke (relocated portable closure, bundled Bun)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = Join-Path $env:RELEASE_DIR 'portable/pig'
          $smoke = Join-Path $env:RUNNER_TEMP 'durable-packaged-smoke'
          New-Item -ItemType Directory $smoke | Out-Null
          rtk proxy bun --no-install build apps/desktop/scripts/smoke.ts --target=bun --packages=external --outfile "$smoke/smoke.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot bundle native smoke' }
          Copy-Item "$app/Resources/app/node_modules" "$smoke/node_modules" -Recurse
          Copy-Item "$app/Resources/app/durable-runtime-manifest.json" $smoke
          # Gate the actual deployed Bun, not only the tooling Bun above.
          rtk proxy "$app/bin/bun.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Cannot run bundled Bun' }
          Push-Location $smoke
          try {
            rtk proxy "$app/bin/bun.exe" --no-install ./smoke.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Packaged native smoke failed' }
          } finally { Pop-Location }
      - name: Publish release
        env:
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          if [[ "$TAG" == nightly ]]; then
            notes="Nightly $VERSION from commit $SHA. Built with the stable identifier and channel to share settings and projects. Unsigned Windows x64 portable build; requires WebView2."
            if ! gh release view nightly >/dev/null 2>&1; then
              gh release create nightly --target "$SHA" --prerelease --latest=false --title 'pig nightly' --notes "$notes"
            fi
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" -f sha="$SHA" -F force=true
            gh release edit nightly --prerelease --latest=false --title 'pig nightly' --notes "$notes"
            gh release upload nightly "$RELEASE_DIR/pig-windows-x64.zip" "$RELEASE_DIR/pig-windows-x64.zip.sha256" --clobber
          else
            gh release create "$TAG" --verify-tag --latest --title "pig $VERSION" \
              --notes "Unsigned Windows x64 portable build; requires WebView2. Install with Scoop using the repository bucket." \
              "$RELEASE_DIR/pig-windows-x64.zip" "$RELEASE_DIR/pig-windows-x64.zip.sha256"
          fi
      # checkver/autoupdate are metadata, not a scheduler. Commit the actual
      # published hash so ordinary 'scoop update' works without Excavator.
      - name: Update stable Scoop manifest on main
        if: steps.release.outputs.tag != 'nightly'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C bucket-update origin/main
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'bucket/pig.json';
          const manifest = JSON.parse(fs.readFileSync(path, 'utf8'));
          manifest.version = process.env.VERSION;
          manifest.architecture['64bit'].url = `https://github.com/cotrin8672/pig/releases/download/v${process.env.VERSION}/pig-windows-x64.zip`;
          manifest.architecture['64bit'].hash = fs.readFileSync(`${process.env.RELEASE_DIR}/pig-windows-x64.zip.sha256`, 'utf8').trim().split(/\s+/)[0];
          fs.writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE
          pnpm exec biome format --write bucket/pig.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/pig.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(scoop): update pig to $VERSION"
            git push origin HEAD:main
          fi
