[package]
name = "pig-remote"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
pig-pairing = { path = "../pairing" }
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros","rt-multi-thread","io-std","io-util","time","sync"] }
